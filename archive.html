permalink: /archive/

<h1>Archive</h1>
<ul class="post-list">
  {%- for post in site.posts -%}
  <li>
    <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
    <span class="post-date">{{ post.date | date: "%Y-%m-%d" }}</span>
  </li>
  {%- endfor -%}
</ul>
